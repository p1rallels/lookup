[package]
name = "lookup"
version = "0.6.0"
edition = "2024"
description = "Fast, focused search for Pi agent sessions"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["parsing"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
